
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tes Kamera D'Penyetz</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 480px;
      margin: 24px auto;
      padding: 16px;
      text-align: center;
      background: #f5f5f5;
    }
    button {
      width: 100%;
      padding: 14px;
      margin: 12px 0;
      font-size: 16px;
      background: #222;
      color: white;
      border: 0;
      border-radius: 8px;
    }
    video {
      width: 100%;
      background: #111;
      border-radius: 10px;
    }
    #status {
      padding: 12px;
      background: white;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h2>D'PENYETZ</h2>
  <p>Tes akses kamera</p>

  <button onclick="tesKamera()">Buka Kamera</button>
  <video id="video" autoplay playsinline muted></video>
  <div id="status">Kamera belum dijalankan.</div>

  <script>
    let aliran = null;

    async function tesKamera() {
      const status = document.getElementById('status');
      const video = document.getElementById('video');

      try {
        if (aliran) {
          aliran.getTracks().forEach(track => track.stop());
        }

        status.textContent = 'Meminta izin kamera...';

        aliran = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment' },
          audio: false
        });

        video.srcObject = aliran;
        await video.play();
        status.textContent = 'BERHASIL: kamera aktif.';
      } catch (e) {
        status.textContent =
          'Kamera gagal dibuka.\n' +
          'Jenis error: ' + e.name + '\n' +
          'Pesan: ' + e.message;
      }
    }

    window.addEventListener('pagehide', () => {
      if (aliran) {
        aliran.getTracks().forEach(track => track.stop());
      }
    });
  </script>
</body>
</html>
